<form>
  <!-- TITOLAZIONE -->
  <mat-toolbar>
    <div class="mat-toolbar-tools">
      <h2>Create New</h2>
    </div>
  </mat-toolbar>


  <!-- SELEZIONE TIPO ELEMENTO -->
  <mat-radio-group name="creationKind" [(ngModel)]="creationKind" class="radio-row px-2 py-2 mb-3">
    <mat-radio-button value="category">New Category</mat-radio-button>
    <mat-radio-button value="relationship">New Relationship</mat-radio-button>
    <mat-radio-button value="modelElement">New Modelling Element</mat-radio-button>
    <mat-radio-button value="connector">New Modelling Connector</mat-radio-button>
  </mat-radio-group>

  <!-- ========== CATEGORY ========== -->
  <ng-container *ngIf="creationKind==='category'">
    <mat-dialog-content>
      <mat-card>
        <mat-form-field class="full-width mb-3">
          <input matInput placeholder="Category Label *" name="input_label" [(ngModel)]="domainElement.label" required>
        </mat-form-field>
      </mat-card>
    </mat-dialog-content>
  </ng-container>

  <!-- ========== RELATIONSHIP ========== -->
  <ng-container *ngIf="creationKind==='relationship'">
    <mat-dialog-content>
      <mat-card>
        <mat-form-field class="full-width mb-3">
          <input matInput placeholder="Relationship Label *" name="rel_label" [(ngModel)]="relationship.label" required>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <mat-select placeholder="Domain Class *" name="rel_domain" [(ngModel)]="relationship.domain" required>
            <mat-option *ngFor="let c of mService.domainClasses" [value]="c.id">{{ c.label }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <mat-select placeholder="Range Class *" name="rel_range" [(ngModel)]="relationship.range" required>
            <mat-option *ngFor="let c of mService.domainClasses" [value]="c.id">{{ c.label }}</mat-option>
          </mat-select>
        </mat-form-field>
      </mat-card>
    </mat-dialog-content>
  </ng-container>

  <!-- ========== MODEL ELEMENT ========== -->
  <ng-container *ngIf="creationKind==='modelElement'">
    <mat-dialog-content>
      <mat-card>
        <mat-form-field class="full-width mb-3">
          <input matInput placeholder="Element Label *" name="label" [(ngModel)]="modelElement.label" required>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <input matInput placeholder="Class URI *" name="uri" [(ngModel)]="modelElement.classUri" required>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <mat-select placeholder="Prefix *" name="prefix" [(ngModel)]="modelElement.languagePrefix" required>
            <mat-option *ngFor="let prefix of mService.namespacePrefixes" [value]="prefix">{{ prefix }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <textarea matInput placeholder="Comment" [(ngModel)]="modelElement.comment"></textarea>
        </mat-form-field>
        <div class="file-upload">
          <label><strong>Select Canvas Image</strong></label>
          <input type="file" accept="image/*" (change)="processImageUpload($event.target, 'image')">
        </div>
        <div class="file-upload">
          <label><strong>Select Thumbnail Image</strong></label>
          <input type="file" accept="image/*" (change)="processImageUpload($event.target, 'thumbnail')">
        </div>
        <!-- Preview -->
        <div *ngIf="currentPaletteElement.imageURL">
          <label>Preview:</label><br>
          <img [src]="imageRoot + currentPaletteElement.imageURL" style="width: 120px; border: 1px solid #ccc;">
        </div>
      </mat-card>
    </mat-dialog-content>
  </ng-container>

  <!-- ========== CONNECTOR ========== -->
  <ng-container *ngIf="creationKind==='connector'">
    <mat-dialog-content>
      <mat-card>
        <mat-form-field class="full-width mb-3">
          <input matInput placeholder="Connector Label *" name="conn_label" [(ngModel)]="connector.label" required>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <mat-select placeholder="From Arrow *" name="fromArrow" [(ngModel)]="connector.fromArrow" required>
            <mat-option value="Standard">Standard</mat-option>
            <mat-option value="Triangle">Triangle</mat-option>
            <mat-option value="None">None</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <mat-select placeholder="To Arrow *" name="toArrow" [(ngModel)]="connector.toArrow" required>
            <mat-option value="Standard">Standard</mat-option>
            <mat-option value="Triangle">Triangle</mat-option>
            <mat-option value="None">None</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="full-width mb-3">
          <mat-select placeholder="Arrow Stroke *" name="arrowStroke" [(ngModel)]="connector.arrowStroke" required>
            <mat-option value="Single">Single</mat-option>
            <mat-option value="Double">Double</mat-option>
            <mat-option value="Dash">Dash</mat-option>
          </mat-select>
        </mat-form-field>
      </mat-card>
    </mat-dialog-content>
  </ng-container>

  <!-- PULSANTI -->
  <mat-dialog-actions align="end" class="mt-3 px-3">
    <button mat-raised-button color="warn" (click)="onCloseCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="save()">OK</button>
  </mat-dialog-actions>
</form>
